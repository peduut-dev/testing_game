<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FPS Zombie - Gedung Pemerintahan Indonesia</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="hud">
      <div>HP: <span id="hp">100</span></div>
      <div>Ammo: <span id="ammo">30</span>/<span id="reserve">90</span></div>
      <div>Weapon: <span id="weapon">Pistol</span> (Lv <span id="weaponLv">1</span>)</div>
      <div>Skor: <span id="score">0</span></div>
      <div>Kunci: <span id="key">Belum</span></div>
      <div>Prompt: <span id="prompt">Klik layar untuk mulai</span></div>
    </div>
    <canvas id="game"></canvas>
    <script src="client.js"></script>
  </body>
</html>
